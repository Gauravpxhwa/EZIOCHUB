<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Access required — IOC Distribution Portal</title>
<style>
body{background:#10161F;color:#E8EDF4;font-family:system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0}

<body><div class="card">
